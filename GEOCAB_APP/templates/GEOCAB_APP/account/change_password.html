{% extends 'GEOCAB_APP/account/_card.html' %}
{% block title %}Промени лозинка - GEOCAB{% endblock %}
{% block card %}
<a href="{% url 'profile' %}" class="small">← Мои податоци</a>
<h1 class="h4 mt-2 mb-4">Промени лозинка</h1>
<form method="post" novalidate>
    {% csrf_token %}
    {% for field in form %}{% include 'GEOCAB_APP/partials/field.html' %}{% endfor %}
    <button type="submit" class="btn btn-dark w-100">Зачувај нова лозинка</button>
</form>
{% endblock %}
