{% extends 'GEOCAB_APP/account/_card.html' %}
{% block title %}Нова лозинка - GEOCAB{% endblock %}
{% block card %}
<h1 class="h4 mb-2">Нова лозинка</h1>
<p class="small text-secondary mb-4">Профил: {{ person.name }} ({{ person.username }})</p>
<form method="post" novalidate>
    {% csrf_token %}
    {% for field in form %}{% include 'GEOCAB_APP/partials/field.html' %}{% endfor %}
    <button type="submit" class="btn btn-dark w-100">Постави лозинка</button>
</form>
{% endblock %}
