<div class="mb-3">
    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
    {% if field.field.widget.input_type == 'select' %}
        <select name="{{ field.html_name }}" id="{{ field.id_for_label }}" class="form-select{% if field.errors %} is-invalid{% endif %}">
            {% for value, label in field.field.choices %}
                <option value="{{ value }}"{% if value|stringformat:'s' == field.value|stringformat:'s' %} selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
    {% else %}
        <input type="{{ field.field.widget.input_type }}" name="{{ field.html_name }}" id="{{ field.id_for_label }}"
               class="form-control{% if field.errors %} is-invalid{% endif %}"
               {% if field.value and field.field.widget.input_type != 'password' %}value="{{ field.value }}"{% endif %}
               {% if field.field.widget.attrs.placeholder %}placeholder="{{ field.field.widget.attrs.placeholder }}"{% endif %}
               {% if field.field.required %}required{% endif %}>
    {% endif %}
    {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
    {% for error in field.errors %}<div class="invalid-feedback">{{ error }}</div>{% endfor %}
</div>
